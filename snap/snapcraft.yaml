
  name: v4l2camera
  adopt-info: v4l2camera
  summary: Web interface to V4L2 
  description: |
    This is a Web interface to v4L2rtspserver, the http server use civetweb, the RTSP server live555. 

  grade: stable 
  confinement: strict
  base: core26
  license: Unlicense
  contact: michel.promonet@free.fr
  platforms:
    amd64:
    arm64:
    armhf:
  
  parts:  
    v4l2camera:
      plugin: cmake
      source: .
      build-packages:
        - cmake
        - make
        - g++
        - pkg-config
        - git
        - curl
        - libssl-dev
        - zlib1g-dev
        - libzstd-dev
        - libjitterentropy3-dev        
        - libasound2-dev
        - npm
      stage-packages:
        - libssl-dev
        - zlib1g-dev
        - libzstd-dev
        - libjitterentropy3-dev        
        - libasound2-dev
        - libasound2-data
      override-pull: |
        craftctl default
        craftctl set version="$(git describe --tags --always)"
      cmake-parameters:
        - -DWITH_COMPRESS=OFF

  apps:
    v4l2camera:
      command: usr/local/bin/v4l2camera -p $SNAP/usr/local/share/v4l2camera
      daemon: simple   
      plugs: [network-bind, camera, alsa]
      environment:
        ALSA_CONFIG_PATH: $SNAP/usr/share/alsa/alsa.conf
